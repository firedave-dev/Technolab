<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechnoLAB-ISTA — Institut Supérieur de Technologies Appliquées, Sévaré</title>
    <!--
      Repli servi aux routes non pre-rendues. Les pages publiques portent leurs
      propres balises, posees par components/Seo.jsx : celles-ci ne s'appliquent
      qu'a l'espace prive, qui n'est de toute facon pas indexe.
    -->
    <meta
      name="description"
      content="TechnoLAB-ISTA, institut supérieur privé agréé à Sévaré (Mopti, Mali) : DUT, licence et master en gestion, technologies et sciences de l’ingénieur. Diplômes reconnus CAMES."
    />

    <!-- Couleur de la barre systeme sur mobile : marine de la charte -->
    <meta name="theme-color" content="#2E4474" />

    <!--
      Icone de marque, declinee du blason officiel par client/scripts/preparer-logo.py.
      Aucune version vectorielle n'est declaree : le logo fourni est un bitmap de
      263 px, et vectoriser automatiquement une banderole portant du micro-texte
      produirait une bouillie plutot qu'un trace propre. Les tailles ci-dessous
      sont toutes servies en PNG, ce que tous les navigateurs acceptent.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/marque/icone-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/marque/icone-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/marque/icone-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Archivo, auto-hebergee (voir src/index.css). Une fonte variable couvre la plage
      400-700 en un seul fichier : plus de requete vers un domaine tiers, et le rendu
      ne depend plus de la disponibilite de Google Fonts.
      Le fichier latin est precharge : c'est la police du premier rendu.
    -->
    <link
      rel="preload"
      href="/polices/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
